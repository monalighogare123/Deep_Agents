[project]
name = "deepagent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "monalighogare123", email = "162950619+monalighogare123@users.noreply.github.com" }
]
requires-python = ">=3.11"
dependencies = [
    "deepagents>=0.7.28",
    "ipykernel>=7.4.0",
    "langchain>=1.4.6",
    "langchain-groq>=1.1.3",
    "langchain-openai>=1.7.2",
    "python-dotenv>=1.2.4",
    "tavily-python>=0.8.5",
]

[project.scripts]
deepagent = "deepagent:main"

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"
